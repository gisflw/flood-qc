[package]
name = "mgb-ops"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
syn = { version = "2", features = ["full", "visit"] }

[lints.rust]
unsafe_code = "forbid"
