[package]
name = "mgb-ops"
version = "0.1.0"
edition = "2024"
default-run = "mgb-ops"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
ctrlc = "3"
getrandom = "0.4.3"
netcdf = { version = "=0.12.1", optional = true, default-features = false }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
krilla = "=0.8.2"
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3"
terrio = { git = "https://github.com/opengeos/terrio", rev = "29fd6e78ba290e37e58aac16df61883e8ed4aed3", version = "0.8.0", default-features = false, features = ["grib", "netcdf-hdf5", "sqlite"] }
toml = "0.9"

[dev-dependencies]
pollster = "0.4"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"

[dependencies.wbvector]
version = "=0.1.6"

[features]
default = []
inundation-write = ["dep:netcdf"]
desktop = ["dep:eframe", "dep:rsplot", "dep:walkers", "dep:rfd", "dep:lyon_tessellation", "dep:ab_glyph", "dep:png", "dep:geo"]

[[bin]]
name = "mgb-ops-desktop"
path = "src/bin/monitor.rs"
required-features = ["desktop"]

[dependencies.eframe]
version = "=0.36.0"
optional = true
default-features = false
features = ["accesskit", "default_fonts", "wgpu", "persistence", "x11", "wayland"]

[dependencies.rsplot]
git = "https://github.com/physwkim/rsplot"
rev = "db6d04647aad4a7abb5b5b593d25094aadfec836"
optional = true

[dependencies.walkers]
version = "=0.62.0"
optional = true
features = ["serde"]

[dependencies.rfd]
version = "0.17"
optional = true

[dependencies.lyon_tessellation]
version = "1"
optional = true

[dependencies.ab_glyph]
version = "0.2"
optional = true

[dependencies.geo]
default-features = false
version = "=0.33.1"
optional = true

[dependencies.png]
version = "0.18"
optional = true
