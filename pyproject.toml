[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgb-ops"
version = "0.1.0"
description = "Operational base for setting and evaluating MGB hydrological model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
mgb-ops = "apps.cli:main"

[project.optional-dependencies]
data = [
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.32",
  "xarray>=2024.1",
  "netCDF4>=1.6",
]
forecast = [
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.32",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "ecmwf-opendata",
  "eccodes",
  "tqdm>=4.66",
]
geo = [
  "rasterio>=1.3",
  "geopandas>=1.0",
]
dashboard = [
  "numpy>=1.26",
  "pandas>=2.1",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "panel>=1.5",
  "plotly>=5.20",
  "geopandas>=1.0",
]
report = [
  "numpy>=1.26",
  "pandas>=2.1",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "geopandas>=1.0",
  "plotly>=5.20",
  "Markdown>=3.6",
  "playwright>=1.49",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "playwright>=1.49",
  "pytest-playwright>=0.6",
  "xarray>=2024.1",
  "netCDF4>=1.6",
]

[tool.setuptools]
package-dir = {"" = "src", "apps" = "apps"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mgb_ops*", "apps", "apps.cli*", "apps.ops_dashboard*"]
namespaces = false

[tool.setuptools.package-data]
"mgb_ops.assets" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
